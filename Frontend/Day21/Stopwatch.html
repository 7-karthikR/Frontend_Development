
<!DOCTYPE html>
<html>
<head>
    <title>Stopwatch</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #edf2f7;
            text-align: center;
            padding-top: 100px;
        }

        .container {
            background: white;
            width: 350px;
            margin: auto;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }

        h1 {
            color: #333;
        }

        #display {
            font-size: 40px;
            margin: 25px 0;
        }

        button {
            padding: 10px 20px;
            margin: 5px;
            border: none;
            border-radius: 5px;
            color: white;
            cursor: pointer;
        }

        #start {
            background: green;
        }

        #stop {
            background: red;
        }

        #reset {
            background: #2874a6;
        }

    </style>
</head>

<body>

    <div class="container">

        <h1>Stopwatch</h1>

        <div id="display">00:00:00</div>

        <button id="start" onclick="startWatch()">Start</button>

        <button id="stop" onclick="stopWatch()">Stop</button>

        <button id="reset" onclick="resetWatch()">Reset</button>

    </div>

    <script>

        let seconds = 0;
        let minutes = 0;
        let milliseconds = 0;

        let timer;

        function startWatch() {

            if (timer) return;

            timer = setInterval(function() {

                milliseconds++;

                if (milliseconds === 100) {
                    milliseconds = 0;
                    seconds++;
                }

                if (seconds === 60) {
                    seconds = 0;
                    minutes++;
                }

                document.getElementById("display").innerHTML =
                    String(minutes).padStart(2, '0') + ":" +
                    String(seconds).padStart(2, '0') + ":" +
                    String(milliseconds).padStart(2, '0');

            }, 10);

        }

        function stopWatch() {

            clearInterval(timer);
            timer = null;

        }

        function resetWatch() {

            clearInterval(timer);

            timer = null;
            seconds = 0;
            minutes = 0;
            milliseconds = 0;

            document.getElementById("display").innerHTML = "00:00:00";

        }

    </script>

</body>
</html>
