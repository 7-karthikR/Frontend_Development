<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    #error{
        color: red;
    }
    #error1{
        color: red;
    }
</style>
<body>
    <input type="text" id="inp1">
    <p id="error"></p>
    <input type="text" id="inp2">
    <p id="error1"></p>
    <button onclick="handleSubmit()">Submit</button>
</body>
<script>
    function handleSubmit() {
        var inp1 = document.getElementById("inp1").value;
        if (inp1 === "") {
            document.getElementById("inp1").style.border="2px solid red";
            document.getElementById("error").innerHTML="Fill the form";
        }
        else{
            document.getElementById("inp1").style.border="2px solid green";
            document.getElementById("error").innerHTML="";
        }

        var inp2 = document.getElementById("inp2").value;
        if (inp2 === "") {
            document.getElementById("inp2").style.border="2px solid red";
            document.getElementById("error1").innerHTML="Fill the form";
        }
        else{
            document.getElementById("inp2").style.border="2px solid green";
            document.getElementById("error1").innerHTML="";
        }
    }
</script>
</html>
